<script src="../../_ds_bundle.js"></script>
<div id="root"></div>
<script type="text/babel">
const { Tabla, ListaDatos, Paginado, ItemHistorial, Tarjeta, Etiqueta } = window.ANPAELDesignSystem_5fc50e;

const filas=[{id:1,caravana:'0075',sexo:'H',raza:'Angus',cat:'Vaquillona',rodeo:null},

{id:3,caravana:'0344',sexo:'H',raza:'Angus',cat:'Vaca',rodeo:'Rodeo 1'}];
function Demo(){const [p,setP]=React.useState(1);
return (<div style={{display:'grid',gap:16}}>
  <Tarjeta denso>

      {clave:'caravana',titulo:'Caravana',numerico:true},
      {clave:'sexo',titulo:'Sexo'},

      {clave:'rodeo',titulo:'Rodeo',render:f=>f.rodeo?f.rodeo:<Etiqueta tono="falta">sin rodeo</Etiqueta>}
    ]} filas={filas}/>
    <Paginado pagina={p} totalPaginas={58} onCambio={setP}/>
  </Tarjeta>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>

      <ul style={{margin:0,padding:0}}>
        <ItemHistorial fecha="14/03/2026" tipo="TACTO" detalle="Preñada · mediana"/>
        <ItemHistorial fecha="02/02/2026" tipo="PESADA" detalle="412 kg" comentario="pesada en la manga chica" ultimo/>
      </ul>
    </Tarjeta>

</div>)}
