<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:0 0 96px}.chip{height:52px;border-radius:var(--radio-md);border:1px solid rgba(30,35,31,.12)}.nm{font-size:11px;font-weight:600;margin-top:5px;line-height:1.35}.hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--cielo-900)"></div><div class="nm">900</div><div class="hex">#1D3B4E</div></div><div class="sw"><div class="chip" style="background:var(--cielo-700)"></div><div class="nm">700 · enlace</div><div class="hex">#2A5570</div></div><div class="sw"><div class="chip" style="background:var(--cielo-500)"></div><div class="nm">500 · foco</div><div class="hex">#3A6E8F</div></div><div class="sw"><div class="chip" style="background:var(--cielo-300)"></div><div class="nm">300</div><div class="hex">#8FB4C8</div></div><div class="sw"><div class="chip" style="background:var(--cielo-100)"></div><div class="nm">100 · info</div><div class="hex">#E3EDF2</div></div></div><p style="font-size:12px;color:var(--text-muted);margin:12px 0 0">Es el único color frío saturado. Enlaces, texto de información y el anillo de foco. Nunca como relleno de botón: ése es verde.</p></body></html>
