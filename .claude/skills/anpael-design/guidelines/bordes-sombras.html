<!-- @dsCard group="Espaciado" viewport="700x185" name="Bordes y sombras" subtitle="El producto separa con un borde gris de 1px, no con sombra" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:52px;border-radius:var(--radio-md);border:1px solid rgba(46,30,23,.12)}.nm{font-size:11px;font-weight:600;margin-top:5px;line-height:1.35}.hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:14px;flex-wrap:wrap">
<div style="flex:1;min-width:180px"><div style="height:60px;background:#fff;border:var(--borde-fino);border-radius:var(--radio-lg)"></div><div class="nm">--borde-fino · 1px #D7DDD8</div><div class="hex">tarjetas, inputs, botón sobrio</div></div>
<div style="flex:1;min-width:180px"><div style="height:60px;background:#fff;border-top:var(--borde-filete);border-bottom:var(--borde-filete)"></div><div class="nm">--borde-filete · 1px #E8ECE8</div><div class="hex">filas de tabla y de ficha</div></div>
<div style="flex:1;min-width:180px"><div style="height:60px;background:#fff;border-radius:var(--radio-lg);box-shadow:var(--sombra-flotante)"></div><div class="nm">--sombra-flotante</div><div class="hex">sólo superficies flotantes</div></div>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:12px 0 0">Ninguna pantalla del producto usa sombra hoy. Si aparece un menú o una hoja móvil, usar <b>--sombra-flotante</b>; nunca sombra en una tarjeta.</p></body></html>
