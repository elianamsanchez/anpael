<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.nm{font-size:11px;font-weight:600;margin-top:5px;line-height:1.35}</style></head><body><div class="g"><div style="flex:1;min-width:150px"><p style="border:1px solid var(--ok-border);background:var(--ok-bg);color:var(--ok-text);border-radius:var(--radio-md);padding:10px;font-size:13px;margin:0">Categoría asignada.</p><div class="nm">ok</div></div><div style="flex:1;min-width:150px"><p style="border:1px solid var(--bad-border);background:var(--bad-bg);color:var(--bad-text);border-radius:var(--radio-md);padding:10px;font-size:13px;margin:0">No se pudo guardar.</p><div class="nm">error</div></div><div style="flex:1;min-width:150px"><p style="border:1px solid var(--warn-border);background:var(--warn-bg);color:var(--warn-text);border-radius:var(--radio-md);padding:10px;font-size:13px;margin:0">La fecha es estimada.</p><div class="nm">atención · durazno</div></div><div style="flex:1;min-width:150px"><p style="border:1px solid var(--info-border);background:var(--info-bg);color:var(--info-text);border-radius:var(--radio-md);padding:10px;font-size:13px;margin:0">Se abre un PDF imprimible.</p><div class="nm">info</div></div></div></body></html>
