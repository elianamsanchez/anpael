<p style="font-size:12px;color:var(--text-muted);margin:12px 0 0">El fondo de la app es plano: <b>#F5F7F5</b>, sin degradé. Un control dentro de una tarjeta va en #F1F4F1 (se hunde); uno sobre el fondo de la app va en blanco, que es lo que lo despega del gris.</p></body></html>
