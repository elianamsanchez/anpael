<!-- @dsCard group="Colores" viewport="700x150" name="Acción y foco" subtitle="Reposo, hover y presionado del botón primario, más el anillo de foco" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:0 0 96px}.chip{height:52px;border-radius:var(--radio-md);border:1px solid rgba(46,30,23,.12)}.nm{font-size:11px;font-weight:600;margin-top:5px;line-height:1.35}.hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
<button style="font:600 14px var(--font-ui);color:#fff;background:var(--action-primary);border:0;border-radius:var(--radio-md);padding:10px 14px">reposo</button>
<button style="font:600 14px var(--font-ui);color:#fff;background:var(--action-primary-hover);border:0;border-radius:var(--radio-md);padding:10px 14px">hover</button>
<button style="font:600 14px var(--font-ui);color:#fff;background:var(--action-primary-press);border:0;border-radius:var(--radio-md);padding:10px 14px">presionado</button>
<button style="font:600 14px var(--font-ui);color:#fff;background:var(--action-accent);border:0;border-radius:var(--radio-md);padding:10px 14px">acento</button>
<input value="con foco" style="font:14px var(--font-ui);color:var(--text-body);padding:9px 10px;border-radius:var(--radio-md);border:1px solid var(--border-default);background:var(--surface-field);outline:var(--foco-anillo);outline-offset:var(--foco-offset);width:110px">
</div>
<p style="font-size:12px;color:var(--text-muted);margin:14px 0 0">Primario <b>monte-700</b> #2F5238, acento <b>pasto-700</b> #47702F (el pasto base #5E8F44 no pasa contraste con texto blanco). El hover oscurece; nunca aclara ni cambia de matiz. El foco es un anillo oliva de 2px con 1px de separación.</p></body></html>
