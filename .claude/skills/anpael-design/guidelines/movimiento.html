<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:52px;border-radius:var(--radio-md);border:1px solid rgba(46,30,23,.12)}.nm{font-size:11px;font-weight:600;margin-top:5px;line-height:1.35}.hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
<button onmouseover="this.style.background='var(--action-primary-hover)'" onmouseout="this.style.background='var(--action-primary)'" style="font:600 14px var(--font-ui);color:#fff;background:var(--action-primary);border:0;border-radius:var(--radio-md);padding:10px 14px;transition:var(--transicion-boton)">pasá el mouse</button>
<span class="hex">--dur-rapida 140ms · --ease-estandar cubic-bezier(.2,0,.2,1)</span>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:14px 0 0">Nada rebota, nada se desliza, nada aparece con retardo. Sólo cambios de color y de opacidad. Tres duraciones: 80ms (respuesta táctil), 140ms (hover), 220ms (algo que aparece). Todo a 0 con <code style="font-family:var(--font-mono)">prefers-reduced-motion</code>.</p></body></html>
