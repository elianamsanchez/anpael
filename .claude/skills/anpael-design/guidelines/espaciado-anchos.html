<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px}.chip{height:52px;border-radius:var(--radio-md);border:1px solid rgba(46,30,23,.12)}.nm{font-size:11px;font-weight:600;margin-top:5px;line-height:1.35}.hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div style="display:grid;gap:8px;font-size:12px">

</div>
<p style="font-size:12px;color:var(--text-muted);margin:12px 0 0">Centrados con <code style="font-family:var(--font-mono)">margin: 6vh auto</code> y 16px de padding lateral. No hay layout de dos columnas ni menú lateral: cada vista es una columna.</p></body></html>
