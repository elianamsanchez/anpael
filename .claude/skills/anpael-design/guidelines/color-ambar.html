<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:0 0 96px}.chip{height:52px;border-radius:var(--radio-md);border:1px solid rgba(30,35,31,.12)}.nm{font-size:11px;font-weight:600;margin-top:5px;line-height:1.35}.hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--ambar-500)"></div><div class="nm">ámbar-500</div><div class="hex">#C68A16</div></div><div class="sw"><div class="chip" style="background:var(--ambar-300)"></div><div class="nm">ámbar-300</div><div class="hex">#E7C377</div></div><div class="sw"><div class="chip" style="background:var(--ambar-100)"></div><div class="nm">ámbar-100 · aviso</div><div class="hex">#FAEDD3</div></div><div class="sw"><div class="chip" style="background:var(--surface-banda)"></div><div class="nm">banda</div><div class="hex">#E9EEE9</div></div><div class="sw"><div class="chip" style="background:var(--monte-hondo)"></div><div class="nm">monte-hondo</div><div class="hex">#2F5238</div></div></div><p style="font-size:12px;color:var(--text-muted);margin:12px 0 0">El ámbar aparece en avisos y en gráficos, en manchas chicas. Las superficies de apoyo (campos, franjas, hundidos) son grises verdosos, no cálidos: <b>#F1F4F1</b> en campos, <b>#E9EEE9</b> en franjas.</p></body></html>
