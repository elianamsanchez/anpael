# =====================================================================
# Compilar y testear en cada push
# =====================================================================
# Para que nadie tenga que acordarse de correr los tests: si algo se
# rompe, se entera solo, y se entera antes de que llegue al campo.
#
# No hace falta ninguna clave: los tests de integracion levantan un
# PostgreSQL propio con Testcontainers. No se conecta a Supabase.
# =====================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  backend:
    name: Backend · Java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify corre compilacion + tests unitarios + tests de integracion.
      # Docker ya viene en el runner de ubuntu, que es lo que Testcontainers
      # necesita.
      - name: Compilar y testear
        working-directory: backend
        run: mvn --batch-mode verify

      - name: Guardar el reporte de tests
        if: always()          # tambien cuando fallan: ahi es cuando sirve
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests-backend
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend · Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Cuando exista package-lock.json (lo genera el primer 'npm install'
      # y hay que commitearlo), agregar aca:
      #     cache: npm
      #     cache-dependency-path: frontend/package-lock.json
      # Ahora no va, porque setup-node falla si el lock no existe.

      # 'npm ci' instala exactamente lo del package-lock, que es lo que se
      # quiere: asi la maquina de uno y la de CI instalan lo mismo. El
      # fallback a 'npm install' es solo para la primera corrida, antes de
      # que el lock este commiteado.
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # 'npm run build' ya corre vue-tsc antes de compilar, asi que un error
      # de tipos rompe el build. No hace falta un paso aparte.
      - name: Revisar tipos y compilar
        working-directory: frontend
        run: npm run build
